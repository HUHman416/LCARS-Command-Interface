plugins {
    id "com.android.application"
}

android {
    namespace "com.lcars.padd"
    compileSdk 35

    defaultConfig {
        applicationId "com.lcars.padd"
        minSdk 26
        targetSdk 35
        versionCode 28100
        versionName "28.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".development"
            versionNameSuffix "-development"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
