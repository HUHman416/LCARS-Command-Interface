plugins {
    id "com.android.application"
}

android {
    namespace "com.lcars.padd"
    compileSdk 35

    defaultConfig {
        applicationId "com.lcars.padd"
        minSdk 26
        targetSdk 35
        versionCode 28400
        versionName "28"
    }

    buildTypes {
        debug {
            // Stable v28 remains debug-signed for direct distribution, but its
            // package identity and visible version are the Stable application.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
