plugins {
    id "com.android.application"
}

android {
    namespace "com.lcars.padd"
    compileSdk 35

    defaultConfig {
        applicationId "com.lcars.padd"
        minSdk 26
        targetSdk 35
        versionCode 29301
        versionName "29.3-rc.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-development"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
