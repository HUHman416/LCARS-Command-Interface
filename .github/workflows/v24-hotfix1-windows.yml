name: Version 24 Hotfix 1 Windows Build

on:
  push:
    branches: [agent/v24-hotfix1-windows-python]
    paths:
      - desktop/main.cjs
      - tests/version24-windows-python-hotfix.test.mjs
      - .github/workflows/v24-hotfix1-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-hotfix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run v24 regressions
        run: node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-windows-python-hotfix.test.mjs
      - name: Validate Electron main process
        run: node --check desktop/main.cjs
      - name: Validate Windows bridge syntax
        run: python -m py_compile windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare hotfix assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force hotfix | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $name = 'LCARS-Windows-Setup-v24-hotfix1.exe'
          Copy-Item $installer.FullName (Join-Path hotfix $name)
          $hash = (Get-FileHash (Join-Path hotfix $name) -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content (Join-Path hotfix "$name.sha256")
          "$hash  $name" | Set-Content hotfix/SHA256SUMS.txt
      - name: Publish v24-hotfix1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows-only hotfix for Version 24.

          Fixes an Electron main-process crash when LCARS attempted to launch the Python bridge with py.exe on systems where only python.exe (or a per-user Python install) was available. The bridge launcher now detects several valid Python 3 runtimes and handles spawn failures safely. This also restores live CPU/GPU/RAM/disk telemetry on affected systems because the Windows bridge can start normally again.

          This release does not include Version 25 development features.
          '@
          if (gh release view v24-hotfix1 2>$null) {
            gh release upload v24-hotfix1 hotfix/* --clobber
            gh release edit v24-hotfix1 --target "$env:GITHUB_SHA" --title "LCARS Command Interface v24 Hotfix 1" --notes $notes
          } else {
            gh release create v24-hotfix1 hotfix/* --target "$env:GITHUB_SHA" --title "LCARS Command Interface v24 Hotfix 1" --notes $notes
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v24-hotfix1-windows
          path: |
            hotfix/LCARS-Windows-Setup-v24-hotfix1.exe
            hotfix/LCARS-Windows-Setup-v24-hotfix1.exe.sha256
            hotfix/SHA256SUMS.txt
          retention-days: 14

# Triggered after workflow registration for the v24 Windows hotfix build.
