name: Version 26.2 Cross-Platform Development Release

on:
  push:
    branches: [26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build hosted renderer
        run: npm run build
      - name: Regression suite
        run: |
          node --test 'tests/*.test.mjs'
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bridge and script validation
        run: |
          python3 -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/*.py
          bash -n install.sh install-autostart.sh uninstall-linux.sh start-local.sh local/lcars-recovery.sh
          node --check desktop/main.cjs
      - name: Build Linux AppImage
        run: npm run desktop:package:linux -- --publish never
      - name: Assemble Linux development package
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="prerelease/LCARS-Universal-Linux-Desktop-v26.2"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          cp "$appimage" prerelease/LCARS-Command-Interface-v26.2-x86_64.AppImage
          cp install-autostart.sh prerelease/LCARS-Linux-Integration-v26.2.sh
          chmod +x prerelease/LCARS-Linux-Integration-v26.2.sh
          (cd prerelease && zip -qr LCARS-Universal-Linux-Desktop-v26.2.zip LCARS-Universal-Linux-Desktop-v26.2)
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v26-2-linux
          path: |
            prerelease/LCARS-Command-Interface-v26.2-x86_64.AppImage
            prerelease/LCARS-Universal-Linux-Desktop-v26.2.zip
            prerelease/LCARS-Linux-Integration-v26.2.sh
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: |
          node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs tests/version25-windows-bridge-hotfix.test.mjs tests/version26-1-module-repository.test.mjs tests/version26-workspace.test.mjs tests/version26-2-regressions.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Windows bridge and shared Python syntax
        run: python -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py
      - name: Validate Electron main process syntax
        run: node --check desktop/main.cjs
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare Windows development installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prerelease | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Copy-Item $installer.FullName prerelease/LCARS-Windows-Setup-v26.2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v26-2-windows
          path: prerelease/LCARS-Windows-Setup-v26.2.exe
          retention-days: 14

  publish-development-release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prerelease
          merge-multiple: true
      - name: Create source archive and updater checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=prerelease/LCARS-Command-Interface-v26.2-Source.zip HEAD
          (cd prerelease && sha256sum LCARS-Command-Interface-v26.2-x86_64.AppImage LCARS-Universal-Linux-Desktop-v26.2.zip LCARS-Linux-Integration-v26.2.sh LCARS-Windows-Setup-v26.2.exe LCARS-Command-Interface-v26.2-Source.zip > SHA256SUMS.txt)
      - name: Verify prerelease assets
        run: |
          set -euo pipefail
          cd prerelease
          test -s LCARS-Command-Interface-v26.2-x86_64.AppImage
          test -s LCARS-Universal-Linux-Desktop-v26.2.zip
          test -s LCARS-Linux-Integration-v26.2.sh
          test -s LCARS-Windows-Setup-v26.2.exe
          test -s LCARS-Command-Interface-v26.2-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish updater-visible Version 26.2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Version 26.2 expands the Development channel with Workstations 3.0, adaptive PADD and desktop presets, Workstation-specific Speed Dials, Operations Automation conditions and retry paths, the Communications Action Center, native detachable Page Peeks, snap previews, and a live minimized-window manager. Module Repository 2.0 accepts operator-added public GitHub catalogs while enforcing repository confinement, SHA-256 verification, declarative Extension API validation, and a no-executable-code boundary; Module Publisher generates a repository-ready catalog, checksums, README, and folder structure. This build also carries forward the Windows-safe vertical-resize, compact popup, compatibility, and Python-launcher hotfix behaviors. It is a Development-channel prerelease for Linux and Windows.'
          if gh release view v26.2 >/dev/null 2>&1; then
            gh release upload v26.2 prerelease/* --clobber
            gh release edit v26.2 --target "$GITHUB_SHA" --title "LCARS Command Interface Version 26.2" --notes "$notes" --prerelease
          else
            gh release create v26.2 prerelease/* --target "$GITHUB_SHA" --title "LCARS Command Interface Version 26.2" --notes "$notes" --prerelease
          fi
