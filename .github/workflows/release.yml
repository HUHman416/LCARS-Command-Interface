name: Build Version 23.1 Release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:package:linux -- --publish never
      - name: Assemble universal Linux package
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="release/LCARS-Universal-Linux-Desktop-v23.1"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          (cd release && zip -qr LCARS-Universal-Linux-Desktop-v23.1.zip LCARS-Universal-Linux-Desktop-v23.1)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/LCARS-Universal-Linux-Desktop-v23.1.zip
          retention-days: 1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:package:windows -- --publish never
      - name: Prepare Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Copy-Item $installer.FullName release/LCARS-Windows-Setup-v23.1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/LCARS-Windows-Setup-v23.1.exe
          retention-days: 1

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create source archive and checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=release/LCARS-Command-Interface-v23.1-Source.zip HEAD
          (cd release && sha256sum LCARS-Universal-Linux-Desktop-v23.1.zip LCARS-Windows-Setup-v23.1.exe LCARS-Command-Interface-v23.1-Source.zip > SHA256SUMS.txt)
      - name: Verify release assets against SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          test -s LCARS-Universal-Linux-Desktop-v23.1.zip
          test -s LCARS-Windows-Setup-v23.1.exe
          test -s LCARS-Command-Interface-v23.1-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v23.1 release/* \
            --target "$GITHUB_SHA" \
            --title "LCARS Command Interface Version 23.1" \
            --notes "Version 23.1 adds unified LCARS framing, live network telemetry, safe file previews, a clickable System Tray drawer, nonblocking startup telemetry, interface-density controls, voice-command acknowledgement audio, optional-component management, favorite-icon containment, and a themed secure Workstation lock screen with optional PBKDF2 password protection. Download SHA256SUMS.txt to verify the exact Linux, Windows, and source files."
