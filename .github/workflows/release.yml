name: Build Version 25-B Release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - desktop/**
      - local/**
      - windows/**
      - shared/**
      - scripts/**
      - extensions/**
      - tests/**
      - package.json
      - package-lock.json
      - electron-builder.yml
      - BUILD-INFO-LINUX.txt
      - install.sh
      - install-autostart.sh
      - uninstall-linux.sh
      - start-local.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-25-b-release
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Version 25-B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tested Version 25-B regression suite
        run: node --test tests/version25-hotfix-v2-popup-resize.test.mjs tests/version25-b-compact.test.mjs tests/version25-1-regressions.test.mjs tests/version25-features.test.mjs
      - name: Build Linux AppImage from Version 25-B source
        run: npm run desktop:package:linux -- --publish never
      - name: Assemble universal Linux package
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo 'Version 25-B Linux AppImage was not produced.' >&2
            exit 1
          fi
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="release/LCARS-Universal-Linux-Desktop-v25-B"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          cp "$appimage" release/LCARS-Command-Interface-v25-B-x86_64.AppImage
          cp install-autostart.sh release/LCARS-Linux-Integration-v25-B.sh
          chmod +x release/LCARS-Linux-Integration-v25-B.sh
          (cd release && zip -qr LCARS-Universal-Linux-Desktop-v25-B.zip LCARS-Universal-Linux-Desktop-v25-B)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-25-B
          path: |
            release/LCARS-Universal-Linux-Desktop-v25-B.zip
            release/LCARS-Command-Interface-v25-B-x86_64.AppImage
            release/LCARS-Linux-Integration-v25-B.sh
          retention-days: 1

  windows:
    name: Windows Version 25-B
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tested Version 25-B regression suite
        run: node --test tests/version25-hotfix-v2-popup-resize.test.mjs tests/version25-b-compact.test.mjs tests/version25-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-windows-bridge-hotfix.test.mjs
      - name: Build Windows installer from Version 25-B source
        run: npm run desktop:package:windows -- --publish never
      - name: Assemble Windows release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Version 25-B Windows installer was not produced.' }
          Copy-Item $installer.FullName release/LCARS-Windows-Setup-v25-B.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-25-B
          path: release/LCARS-Windows-Setup-v25-B.exe
          retention-days: 1

  publish:
    name: Publish Version 25-B
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=release/LCARS-Command-Interface-v25-B-Source.zip HEAD
          (cd release && sha256sum LCARS-Command-Interface-v25-B-x86_64.AppImage LCARS-Universal-Linux-Desktop-v25-B.zip LCARS-Linux-Integration-v25-B.sh LCARS-Windows-Setup-v25-B.exe LCARS-Command-Interface-v25-B-Source.zip > SHA256SUMS.txt)
      - name: Verify release assets against SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -s LCARS-Command-Interface-v25-B-x86_64.AppImage
          test -s LCARS-Universal-Linux-Desktop-v25-B.zip
          test -s LCARS-Linux-Integration-v25-B.sh
          test -s LCARS-Windows-Setup-v25-B.exe
          test -s LCARS-Command-Interface-v25-B-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Version 25-B rolls the tested popup and Page Peek resize corrections into Version 25, including reliable resizing from every edge, corrected Communications Center resize handles, smaller below-default vertical sizing, remembered compact sizes, and responsive narrow-width text/control layouts. Linux and Windows assets are built from the same Version 25-B source. Download SHA256SUMS.txt to verify every release file.'
          if gh release view v25-B >/dev/null 2>&1; then
            gh release upload v25-B release/* --clobber
            gh release edit v25-B --target "$GITHUB_SHA" --title "LCARS Command Interface Version 25-B" --notes "$notes"
          else
            gh release create v25-B release/* --target "$GITHUB_SHA" --title "LCARS Command Interface Version 25-B" --notes "$notes"
          fi
