name: Version 27.2 Standalone PADD and Focused Consoles

on:
  push:
    branches: [27.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build hosted renderer
        run: npm run build
      - name: Regression suite
        run: |
          node --test 'tests/*.test.mjs'
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bridge and script validation
        run: |
          python3 -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/*.py
          bash -n install.sh install-autostart.sh uninstall-linux.sh start-local.sh local/lcars-recovery.sh
          node --check desktop/main.cjs
      - name: Build Linux AppImage
        run: npm run desktop:package:linux -- --publish never
      - name: Assemble Linux development package
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="prerelease/LCARS-Universal-Linux-Desktop-v27.2"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          cp "$appimage" prerelease/LCARS-Command-Interface-v27.2-x86_64.AppImage
          cp install-autostart.sh prerelease/LCARS-Linux-Integration-v27.2.sh
          chmod +x prerelease/LCARS-Linux-Integration-v27.2.sh
          (cd prerelease && zip -qr LCARS-Universal-Linux-Desktop-v27.2.zip LCARS-Universal-Linux-Desktop-v27.2)
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v27-2-linux
          path: |
            prerelease/LCARS-Command-Interface-v27.2-x86_64.AppImage
            prerelease/LCARS-Universal-Linux-Desktop-v27.2.zip
            prerelease/LCARS-Linux-Integration-v27.2.sh
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: |
          node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs tests/version25-windows-bridge-hotfix.test.mjs tests/version26-1-module-repository.test.mjs tests/version26-workspace.test.mjs tests/version26-2-regressions.test.mjs tests/version26-3-stable-readiness.test.mjs tests/version27-1-connected.test.mjs tests/version27-1-android.test.mjs tests/version27-2-consoles.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Windows bridge and shared Python syntax
        run: python -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py shared/lcars_padd.py
      - name: Validate Electron main process syntax
        run: node --check desktop/main.cjs
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare Windows development installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prerelease | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Copy-Item $installer.FullName prerelease/LCARS-Windows-Setup-v27.2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v27-2-windows
          path: prerelease/LCARS-Windows-Setup-v27.2.exe
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Validate private-station address guard
        run: |
          mkdir -p mobile/android/build/address-test
          javac -d mobile/android/build/address-test mobile/android/app/src/main/java/com/lcars/padd/StationAddress.java mobile/android/tools/StationAddressSelfTest.java
          java -cp mobile/android/build/address-test com.lcars.padd.StationAddressSelfTest
      - name: Build installable Android development APK
        run: gradle -p mobile/android --no-daemon :app:assembleDebug
      - name: Prepare Android companion
        run: |
          mkdir -p prerelease
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk prerelease/LCARS-PADD-Companion-v27.2-Android.apk
          test -s prerelease/LCARS-PADD-Companion-v27.2-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v27-2-android
          path: prerelease/LCARS-PADD-Companion-v27.2-Android.apk
          retention-days: 14

  publish-development-release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prerelease
          merge-multiple: true
      - name: Create source archive and updater checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=prerelease/LCARS-Command-Interface-v27.2-Source.zip HEAD
          (cd prerelease && sha256sum LCARS-Command-Interface-v27.2-x86_64.AppImage LCARS-Universal-Linux-Desktop-v27.2.zip LCARS-Linux-Integration-v27.2.sh LCARS-Windows-Setup-v27.2.exe LCARS-PADD-Companion-v27.2-Android.apk LCARS-Command-Interface-v27.2-Source.zip > SHA256SUMS.txt)
      - name: Verify prerelease assets
        run: |
          set -euo pipefail
          cd prerelease
          test -s LCARS-Command-Interface-v27.2-x86_64.AppImage
          test -s LCARS-Universal-Linux-Desktop-v27.2.zip
          test -s LCARS-Linux-Integration-v27.2.sh
          test -s LCARS-Windows-Setup-v27.2.exe
          test -s LCARS-PADD-Companion-v27.2-Android.apk
          test -s LCARS-Command-Interface-v27.2-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish updater-visible Version 27.2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Version 27.2 is a Development-channel candidate for Connected LCARS. The Android PADD is now a standalone native LCARS interface with guided pairing and remembered reconnection. Desktop Settings and Updates are reorganized into focused category consoles to reduce scrolling and empty space. Update downloads lock immediately for the rest of the LCARS session, while the bridge serializes requests and reuses the verified installer so a second request cannot replace an AppImage being installed. This build retains Version 27.1.1 pairing, device-role, and Linux tray-action fixes. Version 26 remains Stable until Version 27.2 completes operator testing.'
          if gh release view v27.2 >/dev/null 2>&1; then
            gh release upload v27.2 prerelease/* --clobber
            gh release edit v27.2 --target "$GITHUB_SHA" --title "LCARS Command Interface Version 27.2" --notes "$notes" --prerelease
          else
            gh release create v27.2 prerelease/* --target "$GITHUB_SHA" --title "LCARS Command Interface Version 27.2" --notes "$notes" --prerelease
          fi
