name: Version 25.1 Cross-Platform Test Builds

on:
  push:
    branches: [agent/v25-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs
      - name: Bridge and script validation
        run: |
          python3 -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/*.py
          bash -n install.sh install-autostart.sh uninstall-linux.sh start-local.sh local/lcars-recovery.sh
          node --check desktop/main.cjs
      - name: Build Linux AppImage
        run: npm run desktop:package:linux -- --publish never
      - name: Assemble test package and checksums
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="test-release/LCARS-Universal-Linux-Desktop-v25.1"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          cp "$appimage" test-release/LCARS-Command-Interface-v25.1-x86_64.AppImage
          cp install-autostart.sh test-release/LCARS-Linux-Integration-v25.1.sh
          chmod +x test-release/LCARS-Linux-Integration-v25.1.sh
          (cd test-release && zip -qr LCARS-Universal-Linux-Desktop-v25.1.zip LCARS-Universal-Linux-Desktop-v25.1)
          (cd test-release && sha256sum LCARS-Command-Interface-v25.1-x86_64.AppImage LCARS-Universal-Linux-Desktop-v25.1.zip LCARS-Linux-Integration-v25.1.sh > SHA256SUMS-25.1-LINUX.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v25-1-linux-test
          path: |
            test-release/LCARS-Command-Interface-v25.1-x86_64.AppImage
            test-release/LCARS-Universal-Linux-Desktop-v25.1.zip
            test-release/LCARS-Linux-Integration-v25.1.sh
            test-release/SHA256SUMS-25.1-LINUX.txt
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs
      - name: Bridge syntax
        run: python -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare Windows prerelease installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-release | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Copy-Item $installer.FullName test-release/LCARS-Windows-Setup-v25.1.exe
          Get-ChildItem test-release/LCARS-Windows-Setup-v25.1.exe | ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content test-release/SHA256SUMS-25.1-WINDOWS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v25-1-windows-test
          path: |
            test-release/LCARS-Windows-Setup-v25.1.exe
            test-release/SHA256SUMS-25.1-WINDOWS.txt
          retention-days: 14

  publish-development-release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prerelease
          merge-multiple: true
      - name: Create source archive and updater checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=prerelease/LCARS-Command-Interface-v25.1-Source.zip HEAD
          (cd prerelease && sha256sum LCARS-Command-Interface-v25.1-x86_64.AppImage LCARS-Universal-Linux-Desktop-v25.1.zip LCARS-Linux-Integration-v25.1.sh LCARS-Windows-Setup-v25.1.exe LCARS-Command-Interface-v25.1-Source.zip > SHA256SUMS.txt)
      - name: Verify prerelease assets
        run: |
          set -euo pipefail
          cd prerelease
          test -s LCARS-Command-Interface-v25.1-x86_64.AppImage
          test -s LCARS-Universal-Linux-Desktop-v25.1.zip
          test -s LCARS-Linux-Integration-v25.1.sh
          test -s LCARS-Windows-Setup-v25.1.exe
          test -s LCARS-Command-Interface-v25.1-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish updater-visible Version 25.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Version 25.1 improves Speed Dial media with artwork, playback, master-volume, and application-audio controls; adds persistent resizing to popup surfaces; and restores plain number-key page navigation outside editable controls. This is a development-channel prerelease for update-path testing.'
          if gh release view v25.1 >/dev/null 2>&1; then
            gh release upload v25.1 prerelease/* --clobber
            gh release edit v25.1 --target "$GITHUB_SHA" --title "LCARS Command Interface Version 25.1" --notes "$notes" --prerelease
          else
            gh release create v25.1 prerelease/* --target "$GITHUB_SHA" --title "LCARS Command Interface Version 25.1" --notes "$notes" --prerelease
          fi
