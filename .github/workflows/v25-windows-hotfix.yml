name: Version 25.2 Windows Python Bridge Hotfix

on:
  push:
    branches: [agent/v25-windows-python-hotfix]
    paths:
      - desktop/main.cjs
      - tests/version25-windows-bridge-hotfix.test.mjs
      - .github/workflows/v25-windows-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Windows hotfix regression and existing v25 regressions
        run: node --test tests/version25-windows-bridge-hotfix.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs
      - name: Validate Electron main process syntax
        run: node --check desktop/main.cjs
      - name: Validate Windows bridge syntax
        run: python -m py_compile windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare hotfix installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force hotfix | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $name = 'LCARS-Windows-Setup-v25.2-Hotfix-1.exe'
          $path = Join-Path hotfix $name
          Copy-Item $installer.FullName $path
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "hotfix/$name.sha256"
          "$hash  $name" | Set-Content hotfix/SHA256SUMS.txt
      - name: Publish Windows hotfix prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v25.2-windows-hotfix1'
          $title = 'LCARS Command Interface v25.2 Windows Hotfix 1'
          $notes = 'Windows-only hotfix for the Electron "spawn py ENOENT" startup failure. The desktop bridge now detects an available Python runtime instead of assuming py.exe exists, handles bridge process launch errors safely, and restores live CPU/GPU/RAM/disk telemetry on affected systems. This is a Development-line tester hotfix and does not change the Linux build.'
          if (gh release view $tag 2>$null) {
            gh release upload $tag hotfix/* --clobber
            gh release edit $tag --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
          } else {
            gh release create $tag hotfix/* --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v25-2-Windows-Hotfix-1
          path: hotfix/*
          retention-days: 14
