name: Version 27.1 Cross-Platform Development Release

on:
  push:
    branches: [27.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build hosted renderer
        run: npm run build
      - name: Regression suite
        run: |
          node --test 'tests/*.test.mjs'
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bridge and script validation
        run: |
          python3 -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/*.py
          bash -n install.sh install-autostart.sh uninstall-linux.sh start-local.sh local/lcars-recovery.sh
          node --check desktop/main.cjs
      - name: Build Linux AppImage
        run: npm run desktop:package:linux -- --publish never
      - name: Assemble Linux development package
        run: |
          set -euo pipefail
          appimage="$(find release-desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          checksum="$(sha256sum "$appimage" | awk '{print $1}')"
          stage="prerelease/LCARS-Universal-Linux-Desktop-v27.1"
          mkdir -p "$stage/local"
          cp "$appimage" "$stage/LCARS-Command-Interface.AppImage"
          cp README-LCARS.md start-local.sh install.sh Uninstall-LCARS-Linux.desktop install-autostart.sh BUILD-INFO-LINUX.txt uninstall-linux.sh Install-LCARS-Linux.desktop Start-LCARS-Linux.desktop Install-LCARS-Linux.run "$stage/"
          cp desktop/icons/512x512.png "$stage/lcars-command-interface.png"
          cp local/lcars-recovery.sh "$stage/local/"
          sed -i "s/^expected_appimage_sha256=.*/expected_appimage_sha256=\"$checksum\"/" "$stage/install.sh"
          sed -i "s/^AppImage SHA-256:.*/AppImage SHA-256: $checksum/" "$stage/BUILD-INFO-LINUX.txt"
          chmod +x "$stage/LCARS-Command-Interface.AppImage" "$stage"/*.sh "$stage"/*.run "$stage"/*.desktop "$stage/local/lcars-recovery.sh"
          cp "$appimage" prerelease/LCARS-Command-Interface-v27.1-x86_64.AppImage
          cp install-autostart.sh prerelease/LCARS-Linux-Integration-v27.1.sh
          chmod +x prerelease/LCARS-Linux-Integration-v27.1.sh
          (cd prerelease && zip -qr LCARS-Universal-Linux-Desktop-v27.1.zip LCARS-Universal-Linux-Desktop-v27.1)
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v27-1-linux
          path: |
            prerelease/LCARS-Command-Interface-v27.1-x86_64.AppImage
            prerelease/LCARS-Universal-Linux-Desktop-v27.1.zip
            prerelease/LCARS-Linux-Integration-v27.1.sh
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression suite
        run: |
          node --test tests/accessibility-css.test.mjs tests/version23-features.test.mjs tests/version23-1-features.test.mjs tests/version23-2-regressions.test.mjs tests/version24-regressions.test.mjs tests/version24-1-regressions.test.mjs tests/version25-features.test.mjs tests/version25-1-regressions.test.mjs tests/version25-windows-bridge-hotfix.test.mjs tests/version26-1-module-repository.test.mjs tests/version26-workspace.test.mjs tests/version26-2-regressions.test.mjs tests/version26-3-stable-readiness.test.mjs tests/version27-1-connected.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Windows bridge and shared Python syntax
        run: python -m py_compile local/lcars_bridge.py windows/lcars_bridge_windows.py shared/lcars_updater.py shared/lcars_extensions.py shared/lcars_documents.py shared/lcars_padd.py
      - name: Validate Electron main process syntax
        run: node --check desktop/main.cjs
      - name: Build Windows installer
        run: npm run desktop:package:windows -- --publish never
      - name: Prepare Windows development installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prerelease | Out-Null
          $installer = Get-ChildItem release-desktop -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Copy-Item $installer.FullName prerelease/LCARS-Windows-Setup-v27.1.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LCARS-v27-1-windows
          path: prerelease/LCARS-Windows-Setup-v27.1.exe
          retention-days: 14

  publish-development-release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: prerelease
          merge-multiple: true
      - name: Create source archive and updater checksums
        run: |
          set -euo pipefail
          git archive --format=zip --output=prerelease/LCARS-Command-Interface-v27.1-Source.zip HEAD
          (cd prerelease && sha256sum LCARS-Command-Interface-v27.1-x86_64.AppImage LCARS-Universal-Linux-Desktop-v27.1.zip LCARS-Linux-Integration-v27.1.sh LCARS-Windows-Setup-v27.1.exe LCARS-Command-Interface-v27.1-Source.zip > SHA256SUMS.txt)
      - name: Verify prerelease assets
        run: |
          set -euo pipefail
          cd prerelease
          test -s LCARS-Command-Interface-v27.1-x86_64.AppImage
          test -s LCARS-Universal-Linux-Desktop-v27.1.zip
          test -s LCARS-Linux-Integration-v27.1.sh
          test -s LCARS-Windows-Setup-v27.1.exe
          test -s LCARS-Command-Interface-v27.1-Source.zip
          sha256sum --check SHA256SUMS.txt
      - name: Publish updater-visible Version 27.1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='Version 27.1 begins the Version 27 Development channel with Connected LCARS. It adds a touch-first phone and tablet PADD companion over the local network, one-use pairing codes, hashed revocable device tokens, viewer/operator/command roles enforced by the local core, and shared status, media, navigation, routine, and favorite-application controls. Terminal, file, process, and power access are never exposed to paired devices. Compatible Linux StatusNotifier tray services now support their native context actions through right-click, the keyboard menu key, or a dedicated Actions control. Version 26 remains the Stable channel while Version 27 is tested.'
          if gh release view v27.1 >/dev/null 2>&1; then
            gh release upload v27.1 prerelease/* --clobber
            gh release edit v27.1 --target "$GITHUB_SHA" --title "LCARS Command Interface Version 27.1" --notes "$notes" --prerelease
          else
            gh release create v27.1 prerelease/* --target "$GITHUB_SHA" --title "LCARS Command Interface Version 27.1" --notes "$notes" --prerelease
          fi
